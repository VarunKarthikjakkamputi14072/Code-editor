apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kuberag
  labels:
    app: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: kuberag/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: worker-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          livenessProbe:
            exec:
              command: ["python", "-c", "import app.config"]
            initialDelaySeconds: 30
            periodSeconds: 30
